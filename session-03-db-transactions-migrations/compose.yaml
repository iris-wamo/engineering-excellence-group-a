services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - MONGO_URI=mongodb://mongodb:27017
      - RUN_MIGRATIONS=true
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  test:
    build: .
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - MONGO_URI=mongodb://mongodb:27017
      - RUN_MIGRATIONS=false
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    command: ["uv", "run", "pytest"]
    profiles:
      - test

volumes:
  postgres_data:
  mongo_data: