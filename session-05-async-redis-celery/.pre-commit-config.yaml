# Pre-commit hooks for session-05-async-redis-celery.
#
# Installed automatically by `make install` (or `make hooks`).
# - pre-commit: every commit touching this session is blocked until ruff + mypy pass.
# - pre-push:   every push touching this session is blocked until pytest passes
#               (needs .env plus PostgreSQL/MongoDB running, e.g. `make docker-up`).
#
# Hooks run through `uv run` so they use the exact tool versions pinned in
# uv.lock and can resolve project dependencies (e.g. taskflow-shared).
# Paths in `files` are relative to the git repository root.

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (session-05)
        entry: bash -c 'cd session-05-async-redis-celery && uv run ruff check --fix .'
        language: system
        files: ^session-05-async-redis-celery/.*\.py$
        pass_filenames: false

      - id: ruff-format
        name: ruff format (session-05)
        entry: bash -c 'cd session-05-async-redis-celery && uv run ruff format .'
        language: system
        files: ^session-05-async-redis-celery/.*\.py$
        pass_filenames: false

      - id: mypy
        name: mypy (session-05)
        entry: bash -c 'cd session-05-async-redis-celery && uv run mypy app'
        language: system
        files: ^session-05-async-redis-celery/.*\.py$
        pass_filenames: false

      # pre-commit buffers hook output until the hook ends, so a long test run
      # looks frozen. When a terminal is attached, stream pytest straight to it to
      # show live progress; otherwise (IDE Git UI, CI) fall back to captured output.
      # The pytest exit code still decides whether the push is blocked.
      - id: pytest
        name: pytest (session-05)
        entry: >-
          bash -c 'cd session-05-async-redis-celery &&
          if { : >/dev/tty; } 2>/dev/null; then
          printf "\n" >/dev/tty; uv run pytest -q --color=yes >/dev/tty 2>&1;
          else uv run pytest -q; fi'
        language: system
        files: ^session-05-async-redis-celery/
        pass_filenames: false
        stages: [pre-push]
